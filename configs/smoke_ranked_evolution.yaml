experiment_name: smoke_ranked_evolution
output_root: results
seed: 17
seeds: [17]

llm:
  provider: heuristic

dataset:
  name: fake
  root: data/raw/image_datasets
  image_size: 32
  download: false
  train_per_class: 8
  val_per_class: 4
  max_train: 80
  max_val: 40
  max_test: 40

training:
  model_name: tinycnn
  pretrained: false
  epochs: 1
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  device: auto
  num_workers: 0
  evaluate_test: true
  save_model: false

rough_training:
  epochs: 1
  evaluate_test: false

full_training:
  epochs: 1
  evaluate_test: true

baselines:
  - none
  - standard
  - randaugment

search:
  population_size: 4
  generations: 1
  elite_count: 2
  offspring_count: 3
  full_top_k: 2
  allow_discouraged: true
  use_feedback: true
  seed_with_baselines: true
  baseline_seed_names: [standard, conservative, randaugment, trivialaugment]
  ranked_prompting: true
  ranked_prompt_max_items: 6
  max_unique_attempts: 3
  objective:
    accuracy_weight: 1.0
    macro_f1_weight: 0.10
    distortion_weight: 0.02
    complexity_weight: 0.01

random_search:
  count: 0
  full_top_k: 0

one_shot_count: 0
