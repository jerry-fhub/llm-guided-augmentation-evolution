experiment_name: smoke_fixmatch_evolution
output_root: results
seed: 11

llm:
  provider: heuristic

dataset:
  name: fake
  root: data/raw/image_datasets
  image_size: 32
  download: true
  train_per_class: 2
  val_per_class: 2
  max_test: 40
  max_unlabeled: 80

training:
  model_name: tinycnn
  pretrained: false
  epochs: 1
  batch_size: 8
  eval_batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  device: auto
  num_workers: 0
  evaluate_test: true
  save_model: false

fixmatch:
  threshold: 0.8
  lambda_u: 1.0
  mu: 2
  max_steps_per_epoch: 2

fixmatch_evolution:
  enabled: true
  population_size: 3
  generations: 1
  elite_count: 1
  offspring_count: 2
  full_top_k: 1
  seed_with_baselines: true
  baseline_seed_names: [standard, conservative, randaugment]
  rough_training:
    epochs: 1
  rough_fixmatch:
    max_steps_per_epoch: 2
  full_training:
    epochs: 1
  full_fixmatch:
    max_steps_per_epoch: 2
  objective:
    accuracy_weight: 1.0
    macro_f1_weight: 0.05
    distortion_weight: 0.01
    complexity_weight: 0.004

