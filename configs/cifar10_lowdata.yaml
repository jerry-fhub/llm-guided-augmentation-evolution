experiment_name: cifar10_lowdata_resnet18
output_root: results
seed: 42
seeds: [42, 43, 44]

dataset:
  name: cifar10
  root: data/raw/image_datasets
  image_size: 32
  download: true
  download_url: https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz
  archive_filename: cifar-10-python.tar.gz
  archive_md5: c58f30108f718f92721af3b95e74349a
  train_per_class: 100
  val_per_class: 100
  max_test: 2000

training:
  model_name: resnet18
  pretrained: false
  epochs: 30
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  device: auto
  num_workers: 0
  evaluate_test: true
  save_model: false

rough_training:
  epochs: 5
  evaluate_test: false

full_training:
  epochs: 30
  evaluate_test: true

baselines:
  - none
  - standard
  - autoaugment
  - randaugment
  - trivialaugment
  - augmix

search:
  population_size: 8
  generations: 3
  elite_count: 3
  offspring_count: 8
  full_top_k: 3
  allow_discouraged: true
  use_feedback: true

random_search:
  count: 12
  full_top_k: 3

one_shot_count: 1
