[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-aug-evolution"
version = "0.1.0"
description = "LLM-guided evolutionary search for image augmentation policies"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "openai>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
