experiment_name: cifar10_final_supervised_multiseed
output_root: results
seed: 47
seeds: [47, 48, 49]

dataset:
  name: cifar10
  root: data/raw/image_datasets
  image_size: 32
  download: true
  download_url: https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz
  archive_filename: cifar-10-python.tar.gz
  archive_md5: c58f30108f718f92721af3b95e74349a
  train_per_class: 100
  val_per_class: 100
  max_test: 2000

training:
  model_name: resnet18_cifar
  pretrained: false
  epochs: 15
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  device: auto
  num_workers: 0
  evaluate_test: true
  save_model: false

full_training:
  epochs: 15
  evaluate_test: true

baselines:
  - none
  - standard
  - standard_mixup
  - standard_cutmix
  - randaugment
  - trivialaugment

llm_policy_file: results/cifar10_resnet18cifar_strong_openai/policies/gen02_mut_005.json
policy_eval_method: supervised_llm_evolved_best
one_shot_count: 1

random_search:
  count: 0
  full_top_k: 0
